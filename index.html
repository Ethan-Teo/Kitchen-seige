<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Kitchen Siege</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=Shrikhand&display=swap">
<style>
/* Layout: playfield on the left, an enamel control column on the right; stacks below 860px.
   Look: a 1950s appliance showroom. Mint tiled wall, enamel panels with chrome trim,
   cherry push-buttons, butter-yellow price tags, diner-script logo. One committed light look. */
:root{
  --wall:#cfe8dd;
  --wall-deep:#b6dccb;
  --grout:rgba(255,255,255,.6);
  --enamel:#fbfdfb;
  --enamel-2:#eef5f1;
  --enamel-3:#e1ece6;
  --chrome:#b7c4c9;
  --chrome-dark:#7c8b91;
  --ink:#1d2b33;
  --ink-2:#4d5f68;
  --ink-3:#7b8d95;
  --cherry:#e2383f;
  --cherry-deep:#a8222a;
  --butter:#ffcf4d;
  --butter-deep:#c79a1c;
  --mint:#2a9d8f;
  --gold:#f2c14e;
  --led:#7ee07a;
  --panel-dark:#1d2b33;
  --p1:#e2383f; --p2:#f0a12e; --p3:#2a9d8f;
  --font-display:'Shrikhand','Arial Black',Impact,system-ui,sans-serif;
  --font-ui:'Barlow Condensed','Arial Narrow','Roboto Condensed',system-ui,sans-serif;
  --font-body:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --radius:16px;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  background-color:var(--wall);
  background-image:
    linear-gradient(var(--grout) 1.5px, transparent 1.5px),
    linear-gradient(90deg, var(--grout) 1.5px, transparent 1.5px);
  background-size:56px 28px;
  color:var(--ink);
  font-family:var(--font-body);
  font-size:15px;
  overflow:hidden;
  -webkit-tap-highlight-color:transparent;
}
#app{position:relative;height:100%}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;min-height:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--butter);outline-offset:2px}
canvas{display:block}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
.num{font-variant-numeric:tabular-nums}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  font-family:var(--font-ui);font-weight:700;font-size:18px;letter-spacing:.06em;text-transform:uppercase;
  padding:12px 20px;border-radius:12px;
  background:var(--enamel);color:var(--ink);
  border:2px solid var(--chrome);box-shadow:0 4px 0 var(--chrome-dark), 0 6px 14px rgba(29,43,51,.12);
  transition:transform .08s, box-shadow .08s, filter .15s;
  user-select:none;
}
.btn:hover{filter:brightness(1.03)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--chrome-dark)}
.btn-primary{background:var(--cherry);color:#fff;border-color:var(--cherry-deep);box-shadow:0 4px 0 var(--cherry-deep), 0 6px 14px rgba(168,34,42,.28)}
.btn-primary:active{box-shadow:0 1px 0 var(--cherry-deep)}
.btn-gold{background:var(--butter);color:var(--ink);border-color:var(--butter-deep);box-shadow:0 4px 0 var(--butter-deep), 0 6px 14px rgba(199,154,28,.3)}
.btn-ghost{background:transparent;box-shadow:none;border-color:transparent;color:var(--ink-2)}
.btn-ghost:hover{background:rgba(255,255,255,.5)}
.btn-small{font-size:14px;padding:7px 12px;border-radius:9px;box-shadow:0 3px 0 var(--chrome-dark)}
.btn-small.btn-primary{box-shadow:0 3px 0 var(--cherry-deep)}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.btn small{font-family:var(--font-body);font-weight:500;font-size:12px;letter-spacing:0;text-transform:none;opacity:.85}
.icon-btn{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:22px;line-height:1;color:var(--ink-2);background:var(--enamel-2);border:2px solid var(--chrome)}
.icon-btn:hover{background:#fff}
.icon-btn svg{width:18px;height:18px}

/* ---------- menu ---------- */
#scr-menu{align-items:center;justify-content:center;padding:16px}
#menu-bg{position:absolute;inset:0;width:100%;height:100%}
.menu-veil{position:absolute;inset:0;background:radial-gradient(ellipse at center, rgba(207,232,221,.25), rgba(29,43,51,.45))}
.fridge{
  position:relative;z-index:1;width:min(460px,100%);
  background:linear-gradient(180deg,#ffffff 0%, var(--enamel) 55%, var(--enamel-2) 100%);
  border:3px solid var(--chrome);border-radius:30px;
  box-shadow:0 18px 50px rgba(29,43,51,.35), inset 0 2px 0 #fff, inset 0 -6px 0 rgba(124,139,145,.12);
  padding:30px 28px 18px;display:flex;flex-direction:column;gap:18px;
}
.fridge::after{content:"";position:absolute;right:-12px;top:34%;width:10px;height:120px;border-radius:6px;background:linear-gradient(90deg,#e8eef0,#9aa8ae);border:2px solid var(--chrome-dark)}
.logo{display:flex;flex-direction:column;align-items:center;line-height:.86;user-select:none}
.logo .l1{font-family:var(--font-display);font-size:30px;color:var(--ink);transform:rotate(-4deg) translateX(-34px)}
.logo .l2{font-family:var(--font-display);font-size:64px;color:var(--cherry);text-shadow:3px 3px 0 var(--ink), 0 0 0 #fff;-webkit-text-stroke:1.5px var(--cherry-deep);transform:rotate(-4deg)}
.tagline{text-align:center;color:var(--ink-2);font-size:15px;max-width:32ch;margin-inline:auto}
.menu-buttons{display:flex;flex-direction:column;gap:12px}
.menu-buttons .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.menu-buttons .row3{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.menu-buttons .row3 .btn{padding-inline:6px;letter-spacing:.03em}
.howto{display:flex;flex-direction:column;gap:12px;font-size:14px;color:var(--ink-2)}
.howto h3{font-family:var(--font-ui);font-size:17px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink);margin-bottom:2px}
.howto ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
.dmg-table{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 10px;font-size:13px;align-items:baseline}
.dmg-table b{font-family:var(--font-ui);font-size:14px;color:var(--ink)}
.dmg-table .imm{color:var(--cherry-deep);font-weight:600}
kbd{font-family:var(--font-ui);font-weight:700;font-size:12px;background:var(--enamel-2);border:1.5px solid var(--chrome);border-bottom-width:3px;border-radius:5px;padding:0 5px;color:var(--ink)}
.menu-buttons .btn{width:100%}
.continue-info{display:block;font-family:var(--font-body);font-size:12px;font-weight:500;text-transform:none;letter-spacing:0;opacity:.9}
.menu-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12px;color:var(--ink-3)}
.clock{font-family:var(--font-ui);font-weight:700;font-size:14px;letter-spacing:.1em;background:var(--panel-dark);color:var(--led);padding:3px 9px;border-radius:7px;cursor:default;user-select:none;animation:blink 1.6s steps(2,start) infinite}
@keyframes blink{50%{opacity:.35}}
.badge{display:inline-flex;align-items:center;gap:6px}
.badge i{width:8px;height:8px;border-radius:50%;background:var(--ink-3);display:inline-block}
.badge.on i{background:var(--mint)}

/* ---------- top bars ---------- */
.topbar{display:flex;align-items:center;gap:12px;padding-block:14px;padding-inline:16px;max-width:1180px;width:100%;margin-inline:auto}
.topbar h2{font-family:var(--font-display);font-size:32px;color:var(--ink)}
.topbar .spacer{flex:1}
.stars-pill{font-family:var(--font-ui);font-weight:700;font-size:16px;letter-spacing:.05em;background:var(--panel-dark);color:var(--butter);padding:6px 12px;border-radius:999px;white-space:nowrap}

/* ---------- map select ---------- */
#scr-maps{overflow-y:auto}
.map-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:18px;max-width:1180px;width:100%;margin-inline:auto;padding-inline:16px;padding-block:4px 28px}
.map-card{
  display:flex;flex-direction:column;text-align:left;background:var(--enamel);border:3px solid var(--chrome);border-radius:20px;overflow:hidden;
  box-shadow:0 6px 0 var(--chrome-dark),0 12px 24px rgba(29,43,51,.12);transition:transform .12s;min-width:0
}
.map-card:hover{transform:translateY(-3px)}
.map-card canvas{width:100%;height:auto;aspect-ratio:1100/680;border-bottom:3px solid var(--chrome)}
.map-meta{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px}
.map-meta .t{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.map-meta h3{font-family:var(--font-ui);font-size:24px;font-weight:700;letter-spacing:.02em}
.level{font-family:var(--font-ui);font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:6px;background:var(--enamel-3);color:var(--ink-2)}
.level.Beginner{background:#d8f2d4;color:#2f6d2a}.level.Intermediate{background:#fff0c4;color:#8a6510}.level.Advanced{background:#ffe0cc;color:#a34a10}.level.Expert{background:#ffd6d8;color:var(--cherry-deep)}
.map-meta p{font-size:14px;color:var(--ink-2)}
.medals{display:flex;gap:6px;align-items:center;margin-top:4px}
.medal{width:22px;height:22px;border-radius:50%;border:2px dashed var(--chrome);display:grid;place-items:center;font-family:var(--font-ui);font-weight:700;font-size:11px;color:var(--ink-3)}
.medal.got{border-style:solid;color:#fff}
.medal.easy.got{background:#c98a45;border-color:#8a5a2b}
.medal.medium.got{background:#aab6bc;border-color:#6b777c}
.medal.hard.got{background:var(--gold);border-color:var(--butter-deep);color:var(--ink)}
.medal.michelin.got{background:var(--cherry);border-color:var(--cherry-deep)}
.medal.mastery.got{background:#6d3fa3;border-color:#4a2575}
.best{margin-left:auto;font-family:var(--font-ui);font-size:13px;color:var(--ink-3);letter-spacing:.04em}

/* ---------- difficulty picker ---------- */
.diffs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.diff{display:flex;flex-direction:column;gap:2px;text-align:left;padding:12px 14px;border-radius:14px;border:2px solid var(--chrome);background:var(--enamel);min-width:0}
.diff b{font-family:var(--font-ui);font-size:20px;letter-spacing:.04em;text-transform:uppercase}
.diff span{font-size:13px;color:var(--ink-2)}
.diff[aria-pressed="true"]{border-color:var(--cherry);background:#fff1f1;box-shadow:0 0 0 3px rgba(226,56,63,.15)}
.diff .medal{position:absolute}
.toggle-row{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;border-radius:14px;background:var(--enamel-2);border:2px solid var(--enamel-3)}
.toggle-row .txt{flex:1;min-width:0}
.toggle-row b{font-family:var(--font-ui);font-size:18px;letter-spacing:.04em;text-transform:uppercase}
.toggle-row span{display:block;font-size:13px;color:var(--ink-2)}
.switch{position:relative;width:52px;height:30px;flex:none}
.switch input{position:absolute;opacity:0;inset:0;cursor:pointer;margin:0}
.switch i{position:absolute;inset:0;border-radius:999px;background:var(--chrome);transition:background .15s}
.switch i::after{content:"";position:absolute;left:4px;top:4px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:transform .15s}
.switch input:checked + i{background:var(--mint)}
.switch input:checked + i::after{transform:translateX(22px)}
.switch input:focus-visible + i{outline:3px solid var(--butter);outline-offset:2px}

/* ---------- game layout ---------- */
#scr-game{overflow:hidden}
.game{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 324px;gap:14px;padding-block:12px;padding-inline:16px;min-height:0}
.stage-col{position:relative;min-width:0;min-height:0;display:flex;align-items:center;justify-content:center}
.stage{position:relative;border-radius:14px;overflow:hidden;box-shadow:0 0 0 4px var(--enamel),0 0 0 7px var(--chrome),0 16px 34px rgba(29,43,51,.25);background:#d7a466;touch-action:none;user-select:none;-webkit-user-select:none}
.stage canvas{width:100%;height:100%}
.hud{position:absolute;top:10px;left:10px;display:flex;gap:8px;flex-wrap:wrap;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:7px;padding:5px 12px 5px 8px;border-radius:999px;background:rgba(29,43,51,.82);color:#fff;font-family:var(--font-ui);font-weight:700;font-size:20px;letter-spacing:.02em;font-variant-numeric:tabular-nums;box-shadow:0 2px 0 rgba(0,0,0,.25)}
.chip svg{width:20px;height:20px;flex:none}
.chip.cash{color:var(--butter)}
.chip.esc{color:#ffb27a}
.chip.esc.calm{color:rgba(255,255,255,.55)}
.chip small{font-size:13px;opacity:.7;font-weight:600;margin-left:-3px}
.chip.flashy{animation:pulse .5s}
@keyframes pulse{40%{transform:scale(1.12)}}
.saved-dot{position:absolute;bottom:12px;right:12px;font-family:var(--font-ui);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:rgba(29,43,51,.7);color:var(--led);padding:3px 8px;border-radius:6px;opacity:0;transition:opacity .4s;pointer-events:none}
.saved-dot.show{opacity:1}
.boss-bars{position:absolute;top:10px;right:10px;width:min(360px,44%);display:flex;flex-direction:column;gap:5px;pointer-events:none}
.boss-bar{background:rgba(29,43,51,.86);border-radius:12px;padding:6px 10px 8px;color:#fff}
.boss-bar .lv{color:#ffb27a;margin-left:7px}
.boss-bar .bn{white-space:nowrap}
.boss-bar .bn > span:first-child{overflow:hidden;text-overflow:ellipsis;min-width:0}
.boss-bar .hpv{flex:none}
.boss-bar .st{color:#bfe9ff;margin-left:7px;font-size:12px}
.boss-bars.many .boss-bar{padding:4px 9px 6px}
.boss-bars.many .bn{font-size:12px}
.boss-bars.many .bt{height:7px;margin-top:3px}
.boss-bar .bn{font-family:var(--font-ui);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:14px;display:flex;justify-content:space-between;gap:8px}
.boss-bar .bt{height:10px;border-radius:6px;background:rgba(255,255,255,.15);overflow:hidden;margin-top:4px}
.boss-bar .bf{height:100%;background:linear-gradient(90deg,var(--cherry),#ff8a3d);width:100%;transition:width .15s}
.boss-bar.shield .bf{background:linear-gradient(90deg,var(--gold),#fff4c2)}
.abilities{position:absolute;left:10px;bottom:10px;display:flex;gap:8px;flex-wrap:wrap;max-width:calc(100% - 20px)}
.ab{position:relative;width:50px;height:50px;border-radius:50%;background:var(--enamel);border:3px solid var(--chrome);box-shadow:0 3px 0 var(--chrome-dark);display:grid;place-items:center;overflow:hidden}
.ab canvas{width:40px;height:40px}
.ab .cdv{position:absolute;inset:0;background:conic-gradient(rgba(29,43,51,.68) calc(var(--cd,0)*1turn), transparent 0);pointer-events:none}
.ab .k{position:absolute;right:2px;bottom:1px;font-family:var(--font-ui);font-weight:700;font-size:11px;background:var(--panel-dark);color:#fff;border-radius:5px;padding:0 4px}
.ab .n{position:absolute;left:3px;top:2px;font-family:var(--font-ui);font-weight:700;font-size:11px;color:var(--ink-2)}
.ab.ready{border-color:var(--butter);box-shadow:0 3px 0 var(--butter-deep),0 0 0 3px rgba(255,207,77,.45)}
.ab:disabled{cursor:default}
.toasts{position:absolute;top:56px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;width:max-content;max-width:90%}
.toast{font-family:var(--font-ui);font-weight:600;font-size:16px;letter-spacing:.02em;background:rgba(29,43,51,.88);color:#fff;padding:6px 14px;border-radius:999px;box-shadow:0 4px 10px rgba(0,0,0,.2);animation:tin .25s ease-out;text-align:center}
.toast.t-gold{background:var(--butter);color:var(--ink)}
.toast.t-warn{background:var(--cherry)}
.toast.t-info{background:#fff;color:var(--ink);border:2px solid var(--chrome)}
.toast.out{opacity:0;transition:opacity .4s}
@keyframes tin{from{transform:translateY(-8px);opacity:0}}
.place-hint{position:absolute;transform:translate(-50%,-120%);font-family:var(--font-ui);font-weight:700;font-size:13px;letter-spacing:.05em;text-transform:uppercase;background:var(--panel-dark);color:#fff;padding:4px 9px;border-radius:7px;pointer-events:none;white-space:nowrap}
.rotate-tip{display:none}

/* ---------- side panel ---------- */
.side{display:flex;flex-direction:column;gap:12px;min-height:0;min-width:0}
.panel{background:var(--enamel);border:3px solid var(--chrome);border-radius:var(--radius);box-shadow:0 6px 0 var(--chrome-dark),0 12px 22px rgba(29,43,51,.12)}
.controls{padding:12px;display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:stretch}
.go{font-size:21px;padding:8px 12px;justify-content:flex-start;gap:10px}
.go svg{width:22px;height:22px;flex:none}
.go-txt{display:flex;flex-direction:column;align-items:flex-start;line-height:1;min-width:0}
.go-sub{font-size:13px;letter-spacing:.06em;opacity:.85;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.speed{min-width:52px;padding:10px;font-family:var(--font-ui);font-weight:700;font-size:18px}
#btn-pause{padding:10px 12px}
.auto-row{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:8px;font-family:var(--font-ui);font-weight:600;font-size:14px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2)}
.preview{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;border-top:2px dashed var(--enamel-3);padding-top:7px;min-height:34px}
.preview .pv-h{font-family:var(--font-ui);font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-right:2px}
.preview .pv{display:inline-flex;align-items:center;gap:2px;font-family:var(--font-ui);font-weight:700;font-size:13px;color:var(--ink-2);background:var(--enamel-2);border-radius:7px;padding:1px 6px 1px 2px}
.preview .pv canvas{width:24px;height:24px}
.preview .pv.boss{background:#ffe4c9;color:#9a3a10}
.preview .skips{margin-left:auto;display:flex;gap:6px}
.preview .skip{font-size:13px;padding:4px 9px}
.skip-prog{height:10px;border-radius:6px;background:var(--enamel-3);overflow:hidden;margin:10px 0 4px}
.skip-prog i{display:block;height:100%;background:linear-gradient(90deg,var(--cherry),#ff8a3d);width:0}
.forecast{border-radius:12px;padding:10px 12px;font-size:15px;margin:6px 0}
.forecast.ok{background:#e3f6ee;color:#145c45}
.forecast.bad{background:#fde4e4;color:#8e1d22}
.preview .pv i{font-style:normal;font-size:10px;color:var(--cherry-deep);margin-left:2px}
.auto-row label{display:flex;align-items:center;gap:8px;cursor:pointer}
.auto-row .switch{width:42px;height:24px}
.auto-row .switch i::after{width:16px;height:16px;top:4px;left:4px}
.auto-row .switch input:checked + i::after{transform:translateX(18px)}
.shop-wrap{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.shop-head{display:flex;align-items:baseline;justify-content:space-between;padding:10px 12px 4px}
.shop-head h3{font-family:var(--font-ui);font-weight:700;font-size:16px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.shop-head span{font-size:12px;color:var(--ink-3)}
.shop{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;padding:6px 10px 10px;overflow-y:auto}
.card{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 2px 6px;border-radius:11px;background:var(--enamel-2);border:2px solid var(--enamel-3);min-width:0}
.card:hover{border-color:var(--chrome);background:#fff}
.card canvas{width:46px;height:46px}
.card .nm{font-family:var(--font-ui);font-weight:700;font-size:12.5px;line-height:1.02;text-align:center;letter-spacing:-.01em;hyphens:manual}
.card .pr{margin-top:auto;font-family:var(--font-ui);font-weight:700;font-size:13px;background:var(--butter);color:var(--ink);padding:0 5px;border-radius:5px;font-variant-numeric:tabular-nums}
.card .hk{position:absolute;left:5px;top:3px;font-family:var(--font-ui);font-weight:700;font-size:11px;color:var(--ink-3)}
.card .st{position:absolute;right:5px;top:3px;font-size:10px;color:var(--butter-deep);letter-spacing:-1px}
.card.poor{opacity:.55}

(function computeLeaks(){
  const leakOf = id => {
    const d = ENEMIES[id];
    if (d._leak != null) return d._leak;
    let t = d.leak || 0;

    return d._leak;

function genRound(n){
  const rng = mulberry32(n * 7919 + 13);
  const pick = arr => arr[Math.floor(rng() * arr.length)];
  const g = [];
  let start = 0;
  const mods = () => {
    let m = '';
    if (n >= 24 && rng() < 0.3) m += 'c';
    if (n >= 16 && rng() < 0.35) m += 'm';
    if (n >= 28 && rng() < 0.3) m += 'a';
    return m;
  };
  // swarms of small pests
  const smallPool = n < 60 ? ['roach','antball','mouse','rat','fireant','snowflea','weevil','pillbug','housefly'] : ['antball','mouse','rat','rat','roach','fireant','snowflea'];
  const swarms = 2 + Math.floor(rng() * 2);
  for (let i = 0; i < swarms; i++){
    const t = pick(smallPool);
    const scale = { roach:1.6, antball:1.0, mouse:0.8, rat:0.55, fireant:2.2, snowflea:2.2, weevil:1.8, pillbug:1.8, housefly:2.4 }[t] || 1;
    const count = Math.round((14 + n * 0.75) * scale * (0.7 + rng() * 0.6));
    const spacing = Math.max(0.08, 0.5 - n * 0.004 - rng() * 0.12);
    g.push([t, count, +spacing.toFixed(2), +start.toFixed(1), mods()]);
    start += count * spacing * (0.35 + rng() * 0.3);
  }
  // vehicles
  if (n > 40){
    const cheese = Math.min(26, Math.floor((n - 38) / 2.2) + Math.floor(rng() * 3));
    if (cheese > 0) g.push(['cheese', cheese, +(Math.max(0.5, 2.2 - n * 0.02)).toFixed(2), +(start * 0.5).toFixed(1), n >= 46 && rng() < 0.4 ? 'a' : '']);
  }
  if (n > 50){
    const baskets = Math.min(14, Math.floor((n - 48) / 4) + (rng() < 0.4 ? 1 : 0));
    if (baskets > 0) g.push(['basket', baskets, 2.4, +(start * 0.4 + 3).toFixed(1), n >= 66 && rng() < 0.4 ? 'a' : '']);
  }
  if (n > 75){
    const trucks = Math.min(10, Math.floor((n - 73) / 5));
    if (trucks > 0) g.push(['truck', trucks, 3.5, 6, n >= 86 && rng() < 0.4 ? 'a' : '']);
  }
  if (n > 90){
    const mids = Math.min(30, Math.floor((n - 88) * 1.3));
    if (mids > 0) g.push(['midnight', mids, 0.8, 4, '']);
  }

    const coons = Math.min(8, Math.floor((n - 96) / 6));
    if (coons > 0) g.push(['raccoon', coons, 5, 8, n > 120 ? 'a' : '']);

    if (a.bubble) a.bubble.pop += b.dmg;
  }
  if (b.allTypes){ a.ignoreImmune = true; propagateII(a); }
}
function applyBuff(s, b){
  if (!s.global) s.range *= b.range;
  if (b.camo) s.camo = true;
  if (b.allTypes) s.allTypes = true;
  for (const id in s.atk){
    const a = s.atk[id];
    buffAttack(a, b);
    if (a.critSpec) buffAttack(a.critSpec, b);
  }
  return s;
}
function inBuffRange(o, t){ return o.base.global || Math.hypot(o.x - t.x, o.y - t.y) <= o.base.range + t.size * 0.6; }
function refreshTowers(){
  for (const t of G.towers) t.base = computeStats(t);
  for (const t of G.towers){
    const b = { speed:1, polar:1, pierce:0, dmg:0, range:1, camo:false, allTypes:false };
    for (const o of G.towers){
      if (o === t || !o.base.buff || !inBuffRange(o, t)) continue;
      const ob = o.base.buff;
      if (ob.speed){ if (o.type === 'freezer') b.polar = Math.max(b.polar, ob.speed); else b.speed = Math.max(b.speed, ob.speed); }
      if (ob.pierce) b.pierce = Math.max(b.pierce, ob.pierce);
      if (ob.dmg) b.dmg = Math.max(b.dmg, ob.dmg);
      if (ob.range) b.range = Math.max(b.range, ob.range);
      if (ob.camo) b.camo = true;
      if (ob.allTypes) b.allTypes = true;
    }
    t.buffs = b;
    t.s = applyBuff(JSON.parse(JSON.stringify(t.base)), b);
    t.s.abilities = t.base.abilities;
    for (const ab of t.s.abilities) if (t.ab[ab.id] == null) t.ab[ab.id] = ab.cd * 0.35;
    for (const id in t.ab) if (!t.s.abilities.some(x => x.id === id)) delete t.ab[id];
  }
  G.globalSlow = 1; G.leakGuard = false; G.sellBonus = 0;
  for (const t of G.towers){
    if (t.s.globalSlow) G.globalSlow = Math.min(G.globalSlow, t.s.globalSlow);
    if (t.s.leakGuard) G.leakGuard = true;
    if (t.s.sellBonus) G.sellBonus = Math.max(G.sellBonus, t.s.sellBonus);
  }
  Hooks.towersChanged();
}

/* ---------------------------------------------------------------------
   Prices
   --------------------------------------------------------------------- */
function masteryDiscount(type){ const r = masteryRank(type); return r >= 7 ? 0.10 : r >= 2 ? 0.04 : 0; }
function discountAt(x, y){
  let d = 0;
  for (const t of G.towers) if (t.base && t.base.buff && t.base.buff.discount && (t.base.global || Math.hypot(t.x - x, t.y - y) <= t.base.range)) d = Math.max(d, t.base.buff.discount);
  return d;
}
function price(base, type, x, y){
  let m = G.D ? G.D.cost : 1;
  m *= 1 - masteryDiscount(type);
  if (perk('bulk')) m *= 0.97;
  if (x != null) m *= 1 - discountAt(x, y);
  return Math.max(5, Math.round(base * m / 5) * 5);
}
function towerCost(type, x, y){ let c = TOWERS[type].cost; if (type === 'knife' && perk('sharp')) c -= 50; return price(c, type, x, y); }
function upgradeCost(t, p){ return price(TOWERS[t.type].paths[p].ups[t.up[p]].cost, t.type, t.x, t.y); }
function paragonCost(type){ return price(TOWERS[type].paragon.cost, type); }
function canAfford(c){ return G.admin.infCash || G.cash >= c; }
function spend(c){ if (!G.admin.infCash) G.cash -= c; }
function addCash(v){ G.cash += v; G.stats.earned += v; }
function sellValue(t){ const pct = perk('resale') ? 0.8 : 0.7; return Math.floor(t.invested * pct * (1 + (G.sellBonus || 0)) + (t.bank || 0)); }

/* ---------------------------------------------------------------------
   New game / load
   --------------------------------------------------------------------- */
function setupGame(mapId, diff, mm){
  const D = DIFFS[diff];
  Object.assign(G, {
    active:true, paused:false, over:false, won:false, mapId, map: MAPS[mapId], paths: MAPS[mapId].paths.map(buildPath), diff, D, mm: !!mm, freeplay:false,
    cash: D.cash + (perk('cash') ? 150 : 0), lives: D.lives + (perk('lives') && diff !== 'michelin' ? 25 : 0),
    round: D.start, roundActive:false, roundTime:0, spawn:null,
    enemies:[], towers:[], projs:[], lobs:[], puddles:[], clouds:[], fx:[], parts:[], loaves:[], timers:[], tornados:[], whirls:[], traps:[], bosses:[],
    nextId:1, time:0, pathToggle:0, xp:{}, xpGame:{}, xpMult: D.xp * (mm ? 2 : 1), attract:false,
    stats:{ kills:0, damage:0, earned:0, leaked:0, start: D.start }, glob:{ rush:null }, usedSecond:false, blitzCd:0,
    globalSlow:1, leakGuard:false, sellBonus:0, lastSnap:null, shake:0, abOrder:[],
  });
}
function newGame(mapId, diff, mm){
  setupGame(mapId, diff, mm);
  Profile.stats.games++;
  saveProfile();
  G.lastSnap = serializeGame();
  storeGame(G.lastSnap);
}
function trapTower(type){ const m = TOWERS[type].base.atk && TOWERS[type].base.atk.main; return !!(m && m.kind === 'trap'); }
function makeTower(type, x, y){
  return { id: G.nextId++, type, x, y, size: TOWERS[type].size, up:[0,0,0], paragon:false, degree:0, tg:'first', aim:-Math.PI / 2, cd:{}, ab:{}, boost:{},
    dmg:0, kills:0, invested:0, bank:0, cashGen:0, shots:0, trapN:0, spot:null, radialRot:0, auraAcc:0, auraDmgAcc:0, loafQ:0, loafT:0, fireAnim:0, placedAt: G.time };
}
function serializeGame(){
  return { v:1, savedAt: Date.now(), mapId:G.mapId, diff:G.diff, mm:G.mm, freeplay:G.freeplay, won:G.won, round:G.round,
    cash: Math.floor(G.cash), lives: G.lives, usedSecond: G.usedSecond, stats: Object.assign({}, G.stats), nextId: G.nextId,
    towers: G.towers.map(t => ({ type:t.type, x:Math.round(t.x), y:Math.round(t.y), up:t.up.slice(), par: t.paragon ? t.degree : 0, tg:t.tg,
      dmg: Math.round(t.dmg), kills:t.kills, inv: Math.round(t.invested), bank: Math.round(t.bank || 0), cashGen: Math.round(t.cashGen || 0),
      spot: t.spot ? [Math.round(t.spot.x), Math.round(t.spot.y)] : null,
      ab: Object.fromEntries(Object.entries(t.ab).map(([k, v]) => [k, Math.round(v * 10) / 10])) })) };
}
function loadGame(data){
  setupGame(data.mapId, data.diff, data.mm);
  Object.assign(G, { round:data.round, cash:data.cash, lives:data.lives, freeplay:!!data.freeplay, won:!!data.won, usedSecond:!!data.usedSecond });
  G.stats = Object.assign(G.stats, data.stats || {});
  for (const d of data.towers){
    if (!TOWERS[d.type]) continue;
    const t = makeTower(d.type, d.x, d.y);
    t.up = d.up.slice(); t.paragon = !!d.par; t.degree = d.par || 0; t.tg = d.tg || 'first';
    t.dmg = d.dmg || 0; t.kills = d.kills || 0; t.invested = d.inv || 0; t.bank = d.bank || 0; t.cashGen = d.cashGen || 0;
    t.ab = Object.assign({}, d.ab || {});
    if (Array.isArray(d.spot) && TOWERS[d.type] && TOWERS[d.type].base.spot) t.spot = { x: clamp(+d.spot[0] || 0, 0, W), y: clamp(+d.spot[1] || 0, 0, H) };
    if (TOWERS[d.type] && trapTower(d.type) && !d.tg) t.tg = 'strong';
    G.towers.push(t);
  }
  refreshTowers();
  G.lastSnap = data;
}
function saveGameNow(){
  if (!G.active) return;
  if (G.over) return;
  storeGame(G.roundActive ? G.lastSnap : serializeGame());
}

/* ---------------------------------------------------------------------
   Tower actions
   --------------------------------------------------------------------- */
function canPlace(type, x, y){
  const r = TOWERS[type].size;
  if (x < r || y < r || x > W - r || y > H - r) return false;
  for (const P of G.paths) if (distToPath(P, x, y) < PATH_W / 2 + r - 4) return false;
  for (const t of G.towers) if (Math.hypot(t.x - x, t.y - y) < t.size + r - 2) return false;
  for (const d of G.map.deco){
    if (!d.solid) continue;
    if (d.r){ if (Math.hypot(d.x - x, d.y - y) < d.r + r - 3) return false; }
    else if (x > d.x - r + 3 && x < d.x + d.w + r - 3 && y > d.y - r + 3 && y < d.y + d.h + r - 3) return false;
  }
  return true;
}
function placeTower(type, x, y){
  if (!canPlace(type, x, y)) return null;
  const c = towerCost(type, x, y);
  if (!canAfford(c)) return null;
  spend(c);
  const t = makeTower(type, x, y);
  t.invested = c;
  if (trapTower(type)) t.tg = 'strong';
  G.towers.push(t);
  refreshTowers();
  Hooks.sfx('place');
  if (G.vis) for (let i = 0; i < 10; i++) part(x + rand(-14, 14), y + rand(-14, 14), rand(-40, 40), rand(-60, -10), 0.5, '#fff8e8', 3, 'dust');
  return t;
}
function upgradeState(t, p){
  if (t.paragon) return { ok:false, why:'Paragon' };
  const up = t.up, tier = up[p];
  if (tier >= 5) return { ok:false, why:'Fully upgraded', max:true };
  const others = [0, 1, 2].filter(i => i !== p);
  if (tier === 0 && others.filter(i => up[i] > 0).length >= 2) return { ok:false, why:'Two paths already chosen', closed:true };
  if (tier >= 2 && others.some(i => up[i] > 2)) return { ok:false, why:'Another path is past tier 2', closed:true };
  const next = tier + 1, rank = masteryRank(t.type);
  if (next === 4 && rank < 1) return { ok:false, why:'Needs ' + RANKS[1].name + ' mastery', mastery:1 };
  if (next === 5 && rank < 3) return { ok:false, why:'Needs ' + RANKS[3].name + ' mastery', mastery:3 };
  return { ok:true, cost: upgradeCost(t, p) };
}
function upgradeTower(t, p){
  const st = upgradeState(t, p);
  if (!st.ok || !canAfford(st.cost)) return false;
  spend(st.cost);
  t.invested += st.cost;
  t.up[p]++;
  refreshTowers();
  Hooks.sfx(t.up[p] === 5 ? 'tier5' : 'upgrade');
  if (G.vis){
    const c = PATH_COLORS[p];
    for (let i = 0; i < (t.up[p] === 5 ? 40 : 16); i++){ const a = rand(0, TAU), v = rand(40, 140); part(t.x, t.y, Math.cos(a) * v, Math.sin(a) * v - 20, 0.7, i % 3 ? c : '#ffffff', 3, 'spark'); }
    G.fx.push({ k:'ring', x:t.x, y:t.y, r0:t.size, r1:t.size + 40, t:0, life:0.45, c, w:3 });
  }
  return true;
}
function sellTower(t){
  const v = sellValue(t);
  addCash(v); G.stats.earned -= v;
  G.towers = G.towers.filter(o => o !== t);
  G.puddles = G.puddles.filter(p => p.tw !== t);
  G.traps = G.traps.filter(p => p.tw !== t);
  G.whirls = G.whirls.filter(p => p.tw !== t);
  refreshTowers();
  Hooks.sfx('sell');
  if (G.vis) fxText(t.x, t.y - 10, '+$' + v.toLocaleString(), '#ffd166');
  return v;
}
function paragonState(t){
  const T = TOWERS[t.type];
  if (t.paragon || !T.paragon) return null;
  if (!t.up.some(v => v === 5)) return null;
  const mine = G.towers.filter(o => o.type === t.type);
  const has = [0, 1, 2].map(p => mine.some(o => o.up[p] === 5));
  const rankOk = masteryRank(t.type) >= 5;
  const exists = G.towers.some(o => o.type === t.type && o.paragon);
  const cost = paragonCost(t.type);
  return { has, rankOk, exists, cost, ok: has.every(Boolean) && rankOk && !exists, degree: paragonDegree(t.type) };
}
function paragonDegree(type){
  let cash = 0, dmg = 0, t5 = 0;
  for (const o of G.towers) if (o.type === type){ cash += o.invested; dmg += o.dmg; t5 += o.up.filter(v => v === 5).length; }
  const power = Math.min(60000, cash / 25) + Math.min(90000, dmg / 120) + Math.min(50000, Math.max(0, t5 - 3) * 6000);
  return clamp(Math.floor(Math.sqrt(power / 20)), 1, 100);
}
function makeParagon(t){
  const st = paragonState(t);
  if (!st || !st.ok || !canAfford(st.cost)) return false;
  spend(st.cost);
  const degree = st.degree;
  let inv = st.cost, dmg = 0, kills = 0;
  for (const o of G.towers) if (o.type === t.type){ inv += o.invested; dmg += o.dmg; kills += o.kills; }
  G.towers = G.towers.filter(o => o.type !== t.type || o === t);
  t.paragon = true; t.degree = degree; t.invested = inv; t.dmg = dmg; t.kills = kills; t.up = [5,5,5]; t.bank = 0;
  refreshTowers();
  Hooks.sfx('paragon');
  Hooks.toast(TOWERS[t.type].paragon.name + ' rises! Degree ' + degree + '.', 'gold');
  if (G.vis){
    G.shake = 0.5;
    for (let i = 0; i < 90; i++){ const a = rand(0, TAU), v = rand(60, 260); part(t.x, t.y, Math.cos(a) * v, Math.sin(a) * v, 1.2, i % 2 ? '#ffd166' : '#fff4c2', 4, 'spark'); }
    G.fx.push({ k:'ring', x:t.x, y:t.y, r0:10, r1:220, t:0, life:0.9, c:'#ffd166', w:6 });
  }
  return true;
}

   Pests
   --------------------------------------------------------------------- */
function spawnEnemy(type, o){
  o = o || {};
  let def = ENEMIES[type];
  const multi = G.paths.length;
  const path = o.path != null ? o.path : (multi > 1 ? (G.pathToggle++ % multi) : 0);
  const big = !!def.big, boss = !!(def.boss || o.boss);
  const ramp = waveRamp(G.round, G.D);
  let hp = def.hp * (o.armored ? 2 : 1) * hpScale(G.round, big, !!def.boss) * (o.hpMul || 1);
  if (def.boss) hp *= G.D.boss * (G.mm ? 1.5 : 1) * Math.sqrt(ramp.hp) * Math.pow(BOSS_LEVEL_HP, bossLevel(G.round) - 1);
  else hp *= ramp.hp;
  if (!big && def.hp < 10) hp = Math.max(def.hp * (o.armored ? 2 : 1), Math.round(hp));
  const e = {
    id: G.nextId++, type, def, path, d: o.d || 0, seg: 0, x: -40, y: 0, ang: 0, rot: 0,
    hp, maxHp: hp, speed: def.speed * speedScale(G.round) * ramp.speed * (o.speedMul || 1), r: def.r, big, boss, tier: def.tier,
    camo: !!(def.camo || o.camo), mold: !!(def.mold || o.mold), armored: !!o.armored, immune: def.immune || null,
    lineage: o.lineage || null, slowMult: 1, slowT: 0, freezeT: 0, stunT: 0, brittle: 0, burn: null,
    vulnT: 0, vulnAmt: 0, soakT: 0, smokeT: 0, heatMult: 1, bigBurn: 0, bigBurnTw: null, crippleT: 0, crippleMult: 1,
    hitT: -10, anim: Math.random() * 10, abT: 0, phase: 0, shieldT: 0, dashT: 0, dashCd: 6, halfDone: false, flashT: 0, dead: false,
    holdT: 0, hold: null, grabImm: 0, batterT: 0, batterMult: 1, burrowT: 0, lvl: 1,
  };
  if (boss){ e.lvl = bossLevel(G.round); e.speed *= Math.min(1.6, 1 + 0.03 * (e.lvl - 1)); }
  const pos = pathPos(G.paths[path], e.d, 0);
  e.x = pos.x; e.y = pos.y; e.seg = pos.seg; e.ang = e.rot = pos.ang;
  G.enemies.push(e);
  if (boss && !o.child){ G.bosses.push(e); Hooks.boss(e); }
  if (!G.attract && !Profile.seen[type]){ Profile.seen[type] = 1; Hooks.newPest(type); }
  return e;
}
function isImmune(e, type, ii, tw){
  if (ii || !e.immune || (tw && tw.s && tw.s.allTypes)) return false;
  return e.immune.indexOf(type) >= 0;
}
function damage(e, amt, type, tw, o){
  if (e.dead) return 0;
  if (e.shieldT > 0 || e.burrowT > 0) return 0;
  if (isImmune(e, type, o && (o.ignoreImmune || o.ii), tw)){
    if (G.vis && Math.random() < 0.05) fxText(e.x, e.y - e.r - 6, 'IMMUNE', '#c9d6dc', 0.5, 11);
    return 0;
  }
  let d = amt;
  if (e.big && o){ if (o.bonusBig) d += o.bonusBig; if (o.bigMult) d *= o.bigMult; }
  if (d <= 0) return 0;
  if (e.freezeT > 0 && e.brittle) d += e.brittle;
  if (e.vulnT > 0) d += e.vulnAmt;
  if (type === 'heat'){ if (e.soakT > 0) d += 1; if (e.smokeT > 0 && e.heatMult > 1) d *= e.heatMult; }
  if (e.crippleT > 0) d *= e.crippleMult;
  d *= G.admin.dmgMult;
  const before = e.hp;
  e.hp -= d; e.hitT = G.time; e.flashT = 0.06;
  const dealt = Math.min(d, before);
  G.stats.damage += dealt;
  if (tw){ tw.dmg += dealt; G.xp[tw.type] = (G.xp[tw.type] || 0) + dealt * G.xpMult; }
  if (e.hp <= 0) kill(e, tw);
  return dealt;
}
function kill(e, tw){
  if (e.dead) return;
  e.dead = true; G.deadFlag = true;
  addCash(e.def.bounty * cashScale(G.round) * waveRamp(G.round, G.D).cash);
  G.stats.kills++;
  if (tw) tw.kills++;
  if (e.shatter && e.freezeT > 0) spawnFrags(e.x, e.y, { count: e.shatter.count, dmg: e.shatter.dmg, pierce: e.shatter.pierce, speed: 320, life: 0.25, type:'normal', sprite:'iceshard' }, e.shatterTw);
  const ch = e.def.children;
  if (ch){
    const cm = e.def.childMods || '';
    const camo = (e.camo && !e.big) || cm.includes('c');
    const mold = (e.mold && !e.boss) || cm.includes('m');
    const lineage = (e.lineage ? e.lineage.slice(-5) : []).concat(e.id);
    let k = 0;
    for (const [cid, n] of ch) for (let i = 0; i < n; i++){
      spawnEnemy(cid, { path: e.path, d: Math.max(0, e.d - k * 7), camo, mold, lineage, child: true });
      k++;
    }
  }
  if (G.vis){
    const col = splatColor(e);
    const n = e.big ? 26 : 5;
    for (let i = 0; i < n; i++){ const a = rand(0, TAU), v = rand(30, e.big ? 220 : 110); part(e.x, e.y, Math.cos(a) * v, Math.sin(a) * v, rand(0.25, 0.5), col, e.big ? 4 : 2.5, 'dot'); }
    if (e.big){ G.fx.push({ k:'boom', x:e.x, y:e.y, r:e.r * 1.6, t:0, life:0.4, c:'#fff2d6' }); G.shake = Math.max(G.shake, e.boss ? 0.6 : 0.18); }
  }
  Hooks.sfx(e.big ? 'crack' : 'pop');
  const bi = G.bosses.indexOf(e);
  if (bi >= 0){ G.bosses.splice(bi, 1); Hooks.boss(null); Hooks.toast(e.def.name + ' defeated!', 'gold'); }
}
function splatColor(e){
  return { ant:'#3a2418', fruitfly:'#b07a3a', housefly:'#33383d', weevil:'#6b5444', pillbug:'#6f7782', fireant:'#d9531e', snowflea:'#cfe7f3', spore:'#7aa95c',
    roach:'#6b3a1f', antball:'#4a2c1c', mouse:'#9aa0a6', rat:'#5f5a55', cheese:'#f2c14e', basket:'#c08a4a', midnight:'#5b3a7a', truck:'#e2383f',
    raccoon:'#7d8288', ratking:'#ffd166', greatmold:'#7aa95c', queen:'#8b2f2f', flylord:'#2f3a33', skunk:'#24272b', mole:'#4a3f3a', bigcheese:'#f2c14e' }[e.type] || '#888';
}
function leak(e){
  e.dead = true; G.deadFlag = true;
  const L = e.boss ? 99999 : e.def._leak;
  G.stats.leaked += Math.min(L, 9999);
  const bi = G.bosses.indexOf(e);
  if (bi >= 0){ G.bosses.splice(bi, 1); Hooks.boss(null); }
  if (!G.admin.god && !G.attract) G.lives -= L;
  Hooks.sfx('leak');
  if (G.vis){ G.fx.push({ k:'flash', c:'rgba(226,56,63,0.22)', t:0, life:0.35 }); G.shake = Math.max(G.shake, 0.25); }
  if (G.leakGuard && G.blitzCd <= 0) leakGuard();
  if (G.lives <= 0 && !G.over){
    if (perk('second') && !G.usedSecond){ G.usedSecond = true; G.lives = 25; Hooks.toast('Second Helping! 25 lives restored.', 'gold'); }
    else { G.lives = 0; gameOver(); }
  }
}
function leakGuard(){
  G.blitzCd = 20;
  let n = 0;
  for (const e of G.enemies){
    if (e.dead || e.big || !onScreen(e)) continue;
    kill(e, null); n++;
    if (G.vis && n % 3 === 0) G.fx.push({ k:'boom', x:e.x, y:e.y, r:30, t:0, life:0.35, c:'#ffcf7a' });
  }
  Hooks.toast('Toast storm! The kitchen is cleared.', 'warn');
  Hooks.sfx('boom');
}

/* status effects */
function slowE(e, mult, dur){
  if (e.boss) mult = 1 - (1 - mult) * 0.5;
  if (e.slowT <= 0 || mult <= e.slowMult){ e.slowMult = mult; e.slowT = Math.max(e.slowT, dur); }
}
function freezeE(e, f, tw){
  if (e.immune && e.immune.indexOf('cold') >= 0 && !f.ii && !f.ignoreImmune && !(tw && tw.s && tw.s.allTypes)) return;
  const k = perk('icebox') ? 1.15 : 1;
  if (e.big){
    if (f.bigDur) e.freezeT = Math.max(e.freezeT, f.bigDur * k * (e.boss ? 0.5 : 1));
    else slowE(e, 0.82, f.dur * k);
  } else e.freezeT = Math.max(e.freezeT, f.dur * k);
  if (f.brittle) e.brittle = Math.max(e.brittle, f.brittle);
  if (f.shatter){ e.shatter = f.shatter; e.shatterTw = tw; }
}
function stunE(e, d){ if (e.boss) d *= 0.4; e.stunT = Math.max(e.stunT, d); }

  const dur = b.dur * (perk('slow') ? 1.25 : 1);

  if (G.vis){ for (let i = 0; i < 6; i++){ const a = rand(0, TAU), v = rand(50, 120); part(e.x, e.y, Math.cos(a) * v, Math.sin(a) * v, 0.45, i % 2 ? '#c9d2d6' : '#e2383f', 3, 'spark'); } fxText(e.x, e.y - e.r - 8, 'SCRUBBED', '#bfe9ff', 0.7, 11); }
}
function applyHit(e, a, tw){

  if (e.dead) return;
  if (isImmune(e, a.type, a.ignoreImmune, tw)) return;
  if (a.soak) e.soakT = Math.max(e.soakT, 3);
  if (a.strip) stripArmor(e);
  if (a.burn) addBurn(e, a.burn, tw, a.ignoreImmune);
  if (a.freeze) freezeE(e, a.freeze, tw);
  if (a.slow) slowE(e, e.big ? (a.slow.bigMult || 1) : a.slow.mult, a.slow.dur);

  if (a.bigKnock && e.big && !e.boss) knockE(e, a.bigKnock);

/* extra effects carried by an explosion (impact, blast, mine) */

/* grabs: dough hooks and soap bubbles hold a pest in place */
function grab(e, a, tw){

function releaseHold(e){
  const h = e.hold;

function knockE(e, k){

/* ---------------------------------------------------------------------
   Targeting
   --------------------------------------------------------------------- */
function attackRange(t, a){ return a.rangeAbs || t.s.range * (a.rangeMul || 1); }
function score(e, t, mode){
  const P = G.paths[e.path];
  switch (mode){
    case 'last': return P.len - e.d;
    case 'close': return -((e.x - t.x) ** 2 + (e.y - t.y) ** 2);
    case 'strong': return e.tier * 1e9 + Math.min(e.hp, 9e8) - (P.len - e.d) * 1e-3;
    default: return -(P.len - e.d);
  }
}
function canTarget(t, e, a){
  if (e.dead || e.burrowT > 0 || !onScreen(e)) return false;
  if (e.camo && !t.s.camo) return false;
  if (a && !a.targetsAll && !a.ignoreImmune && !t.s.allTypes && e.immune && e.immune.indexOf(a.dtype) >= 0) return false;
  return true;
}
function acquire(t, range, a, mode){
  let list;
  if (range >= 5000) list = G.enemies; else list = query(t.x, t.y, range, Q0);
  let best = null, bs = -Infinity;
  mode = mode || t.tg;
  for (let i = 0; i < list.length; i++){
    const e = list[i];
    if (!canTarget(t, e, a)) continue;
    const sc = score(e, t, mode);
    if (sc > bs){ bs = sc; best = e; }
  }
  return best;
}
function acquireBig(t, range, a){
  let best = null, bs = -Infinity;
  const list = range >= 5000 ? G.enemies : query(t.x, t.y, range, Q0);
  for (const e of list){
    if (!canTarget(t, e, a)) continue;
    const sc = (e.big ? 1e12 : 0) + e.hp;
    if (sc > bs){ bs = sc; best = e; }
  }
  return best;
}
function acquireN(t, range, a, mode, n, filter){
  const list = range >= 5000 ? G.enemies : query(t.x, t.y, range, Q0);
  const c = [];
  for (let i = 0; i < list.length; i++){
    const e = list[i];
    if (!canTarget(t, e, a) || (filter && !filter(e))) continue;
    c.push([score(e, t, mode || t.tg), e]);
  }
  c.sort((p, q) => q[0] - p[0]);
  const out = [];
  for (let i = 0; i < c.length && i < n; i++) out.push(c[i][1]);
  return out;
}
function anyTarget(t, a){
  for (const e of G.enemies) if (canTarget(t, e, a)) return true;
  return false;
}
function predictPos(e, dt){
  const P = G.paths[e.path];
  const mult = (e.freezeT > 0 || e.stunT > 0 || e.holdT > 0) ? 0 : Math.min(e.slowT > 0 ? e.slowMult : 1, e.batterT > 0 ? e.batterMult : 1);
  const d = Math.min(P.len, e.d + e.speed * mult * dt);
  return pathPos(P, d, e.seg);
}

/* ---------------------------------------------------------------------
   Projectiles and other attack objects
   --------------------------------------------------------------------- */
function pushProj(x, y, ang, spd, life, spec, tw, target){
  if (G.projs.length > 1400) return null;
  const p = { x, y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd, ang, spd, life, max: life, size: spec.size || 5, spec, tw,
    pierce: spec.pierce || 1, hit: new Set(), target: target || null, spin: Math.random() * TAU, done: false, hitSomething: false, curve: spec.spiral ? 2.4 : 0 };
  G.projs.push(p);
  return p;
}
function spawnFrags(x, y, f, tw){
  const off = Math.random() * TAU;
  for (let i = 0; i < f.count; i++){
    const a = off + i / f.count * TAU;
    pushProj(x, y, a, f.speed, f.life, f, tw);
  }
}
function explodeAt(x, y, ex, tw, spec){
  const list = query(x, y, ex.r, Q2);
  let n = 0;
  if (list.length > ex.pierce) list.sort((a, b) => ((a.x - x) ** 2 + (a.y - y) ** 2) - ((b.x - x) ** 2 + (b.y - y) ** 2));
  for (let i = 0; i < list.length && n < ex.pierce; i++){
    const e = list[i];
    if (e.dead) continue;
    damage(e, ex.dmg, ex.type, tw, ex);
    if (!e.dead) applyFx(e, ex, tw);
    n++;
  }
  if (G.vis){
    G.fx.push({ k:'boom', x, y, r: ex.r, t:0, life: 0.32, c: ex.type === 'heat' || ex.burn ? '#ff8a3d' : '#ffc46b' });
    if (!lowFx()) for (let i = 0; i < 4; i++){ const a = rand(0, TAU), v = rand(40, 120); part(x, y, Math.cos(a) * v, Math.sin(a) * v, 0.4, '#c98a3c', 2.5, 'crumb'); }
  }
  Hooks.sfx('boom');
  if (spec){
    if (spec.frag) spawnFrags(x, y, spec.frag, tw);

}
function scheduleCluster(x, y, c, tw, depth){
  const n = c.count;
  for (let i = 0; i < n; i++){
    const a = i / n * TAU + rand(-0.3, 0.3), dist = c.spread * rand(0.5, 1.1);
    const cx = clamp(x + Math.cos(a) * dist, 0, W), cy = clamp(y + Math.sin(a) * dist, 0, H);
    G.timers.push({ t: rand(0.1, 0.25), fn: () => {
      explodeAt(cx, cy, c.type ? c : Object.assign({}, c, { type:'blast' }), tw, null);
      if (G.vis) G.fx.push({ k:'mini', x:cx, y:cy, t:0, life:0.25 });
      if (depth > 1) scheduleCluster(cx, cy, Object.assign({}, c, { count: Math.max(3, Math.floor(n / 2)), spread: c.spread * 0.7 }), tw, depth - 1);
    }});
  }
}
function lobTo(t, a, x, y, extra){
  const x1 = clamp(x, 4, W - 4), y1 = clamp(y, 4, H - 4);
  const h = a.mortar ? 70 + Math.hypot(x1 - t.x, y1 - t.y) * 0.22 : 34 + Math.random() * 18;
  G.lobs.push(Object.assign({ x0: t.x, y0: t.y - 8, x1, y1, t: 0, dur: a.travel || 0.45, spec: a, tw: t, h, spin: Math.random() * TAU }, extra || {}));
}
function addPuddle(x, y, p, tw, r){
  let n = 0;
  for (let i = G.puddles.length - 1; i >= 0; i--) if (G.puddles[i].tw === tw && ++n >= 9) G.puddles.splice(i, 1);
  G.puddles.push({ x, y, r: r || p.r, t: 0, dur: p.dur, spec: p, tw, acc: Math.random() * 0.1, seed: Math.random() * 100 });
}
/* trail sample points, used by traps and pasta rain */
let trailCache = { key:'', pts:[] };
function trailPoints(){
  const key = G.mapId + ':' + G.paths.length;
  if (trailCache.key === key) return trailCache.pts;
  const pts = [];
  G.paths.forEach((P, pi) => {
    for (let d = 0; d <= P.len; d += 9){
      const q = pathPos(P, d, 0);
      if (q.x < 10 || q.x > W - 10 || q.y < 10 || q.y > H - 10) continue;
      pts.push({ x: q.x, y: q.y, ang: q.ang, path: pi, d, left: P.len - d });
    }
  });
  trailCache = { key, pts };
  return pts;
}
function trapSpots(t, range){
  const key = G.mapId + ':' + Math.round(range);
  if (t._spots && t._spots.key === key) return t._spots;
  const pts = trailPoints().filter(p => Math.hypot(p.x - t.x, p.y - t.y) <= range);
  const byExit = pts.slice().sort((a, b) => a.left - b.left);
  const byDist = pts.slice().sort((a, b) => Math.hypot(a.x - t.x, a.y - t.y) - Math.hypot(b.x - t.x, b.y - t.y));
  t._spots = { key, pts, byExit, byDist };
  return t._spots;
}
function pickSpot(t, S){
  const n = S.pts.length, part = Math.max(1, Math.ceil(n * 0.35));
  const r = () => Math.floor(Math.random() * part);
  switch (t.tg){
    case 'first': return S.byExit[r()];
    case 'last': return S.byExit[n - 1 - r()];
    case 'close': return S.byDist[r()];
    default: return S.pts[Math.floor(Math.random() * n)];
  }
}
function addTrap(tw, a, pt, mine, o){
  o = o || {};
  if (!o.rain){
    const cap = tw.paragon ? 140 : 70;
    let n = 0;
    for (let i = G.traps.length - 1; i >= 0; i--) if (G.traps[i].tw === tw && !G.traps[i].rain && ++n >= cap) G.traps.splice(i, 1);
  }
  const off = rand(-6, 6);
  const x = pt.x - Math.sin(pt.ang) * off, y = pt.y + Math.cos(pt.ang) * off;
  G.traps.push({ x, y, r: mine ? Math.max(14, a.r || 14) : (a.r || 14), spec: a, tw, pierce: a.pierce || 1, max: a.pierce || 1, life: o.life || a.life || 20, t: 0,
    fly: o.fly != null ? o.fly : 0.22, x0: o.x0 != null ? o.x0 : tw.x, y0: o.y0 != null ? o.y0 : tw.y, hit: new Set(), bigHit: new Map(),
    mine: !!mine, rain: !!o.rain, sprite: mine ? 'ravioli' : a.sprite, rot: rand(0, TAU), seed: Math.random() * 100 });
}
function pathPointAhead(e, ahead){
  const P = G.paths[e.path];
  return pathPos(P, Math.min(P.len - 5, e.d + ahead), e.seg);
}

/* fire one attack; returns true if something happened */
function setAim(t, id, ang){ if (id === 'main' || !t.base.atk.main) t.aim = ang; else t.aim2 = ang; }
const BOOM_ARC = [[1.05, 1], [1.05, -1], [0.8, 1], [0.8, -1], [1.3, 1], [1.3, -1]];
function fire(t, a, id){
  const range = attackRange(t, a);
  switch (a.kind){
    case 'proj': {
      const tg = a.targetBig ? acquireBig(t, range, a) : acquire(t, range, a);
      if (!tg) return false;
      let ax = tg.x, ay = tg.y;
      const lead = a.boomerang ? 1.21 : 1;
      if (!a.homing){
        let tt = Math.hypot(tg.x - t.x, tg.y - t.y) * lead / a.speed;
        for (let k = 0; k < 2; k++){ const p = predictPos(tg, tt); ax = p.x; ay = p.y; tt = Math.hypot(ax - t.x, ay - t.y) * lead / a.speed; }
      }
      const ang = Math.atan2(ay - t.y, ax - t.x);
      setAim(t, id, ang);
      let spec = a;
      if (a.crit){ t.shots++; if (t.shots % a.crit.every === 0) spec = a.critSpec; }
      const n = spec.count || 1;
      if (spec.boomerang){
        /* each plate flies a circle that passes through the target and comes home */
        const c = Math.max(36, Math.hypot(ax - t.x, ay - t.y));
        for (let i = 0; i < n; i++){
          const [al, side] = BOOM_ARC[i % BOOM_ARC.length];
          const R = c / (2 * Math.sin(al));
          const life = Math.min(3.5, TAU * R / spec.speed);
          const p = pushProj(t.x, t.y, ang - side * al, spec.speed, life, spec, t, null);
          if (p) p.curve = side * spec.speed / R;
        }
      } else {
        const life = (Math.min(range, 900) * 1.15 * (spec.lifeMul || 1)) / spec.speed;
        for (let i = 0; i < n; i++){
          const off = (i - (n - 1) / 2) * (spec.spread || 0.18);
          pushProj(t.x + Math.cos(ang) * t.size * 0.6, t.y + Math.sin(ang) * t.size * 0.6, ang + off, spec.speed, life, spec, t, spec.homing ? tg : null);
        }
      }
      t.fireAnim = 0.18;
      Hooks.sfx(a.explode ? 'thunk' : a.boomerang ? 'whoosh' : 'throw');
      return true;
    }
    case 'lob': case 'slick': case 'cloud': {
      const spotMode = !!(a.mortar && t.spot);
      let tg = null;
      if (spotMode){ if (!anyTarget(t, a)) return false; }
      else { tg = acquire(t, range, a); if (!tg) return false; }
      let spec = a;
      if (a.crit){ t.shots++; if (t.shots % a.crit.every === 0) spec = a.critSpec; }
      const n = spec.count || 1;
      for (let i = 0; i < n; i++){
        let p;
        if (spec.kind === 'lob'){
          p = spotMode ? { x: t.spot.x, y: t.spot.y } : predictPos(tg, spec.travel || 0.45);
          if (spec.mortar){ const an = rand(0, TAU), rr = (spec.spreadR || 0) * Math.sqrt(Math.random()) * (n > 1 ? 1.6 : 1); p = { x: p.x + Math.cos(an) * rr, y: p.y + Math.sin(an) * rr }; }
          else if (n > 1) p = { x: p.x + rand(-34, 34), y: p.y + rand(-34, 34) };
        } else {
          p = pathPointAhead(tg, tg.speed * (spec.travel || 0.4) + (spec.puddle ? spec.puddle.r * 0.7 : 40));
          if (Math.hypot(p.x - t.x, p.y - t.y) > range * 1.15) p = predictPos(tg, spec.travel || 0.4);
        }
        lobTo(t, spec, p.x, p.y, spec.kind === 'cloud' ? { cloud: true } : null);
      }
      const fx = spotMode ? t.spot.x : tg.x, fy = spotMode ? t.spot.y : tg.y;
      setAim(t, id, Math.atan2(fy - t.y, fx - t.x));
      t.fireAnim = 0.2;
      Hooks.sfx(a.kind === 'cloud' ? 'puff' : a.mortar ? 'thunk' : 'splat');
      return true;
    }
    case 'pulse': {
      const list = query(t.x, t.y, range, Q1);
      let vis = false;
      for (const e of list) if (!e.dead && onScreen(e) && (!e.camo || t.s.camo)){ vis = true; break; }
      if (!vis) return false;
      if (list.length > a.pierce) list.sort((p, q) => score(q, t, 'first') - score(p, t, 'first'));
      let n = 0;
      for (let i = 0; i < list.length && n < a.pierce; i++){
        const e = list[i];
        if (e.dead || !onScreen(e)) continue;
        applyHit(e, a, t); n++;
      }
      if (a.radial) fireRadial(t, a.radial);
      t.fireAnim = 0.3;
      if (id !== 'main') t.fire2 = 0.4;
      if (G.vis) G.fx.push({ k: a.vfx || 'ring', x: t.x, y: t.y, r0: t.size, r1: range, t: 0, life: a.vfx === 'frost' ? 0.5 : a.vfx === 'basket' ? 0.45 : 0.28, c: a.vfx === 'frost' ? '#bfe9ff' : a.vfx === 'steam' ? '#ffffff' : a.hot ? '#ff9a52' : '#d7f5ee', w: 3 });
      Hooks.sfx(a.vfx === 'frost' ? 'freeze' : a.vfx === 'steam' ? 'puff' : a.vfx === 'basket' ? 'sizzle' : 'whirl');
      return true;
    }
    case 'radial': {
      const tg = acquire(t, a.range || range, a);
      if (!tg) return false;
      fireRadial(t, a);
      return true;
    }
    case 'beam': {
      const tg = acquire(t, range, a);

      const ang = Math.atan2(tg.y - t.y, tg.x - t.x);
      setAim(t, id, ang);
      const len = range + 24, dx = Math.cos(ang), dy = Math.sin(ang);

      const list = query(x0 + dx * len / 2, y0 + dy * len / 2, len / 2 + 8, Q1);
      const hits = [];
      for (const e of list){
        if (e.dead) continue;
        const px = e.x - x0, py = e.y - y0;
        const along = px * dx + py * dy;
        if (along < -e.r || along > len + e.r) continue;
        const perp = Math.abs(px * dy - py * dx);
        if (perp <= e.r + (a.width || 6) * 0.5) hits.push([along, e]);
      }
      hits.sort((p, q) => p[0] - q[0]);
      let n = 0, last = null;
      for (const [, e] of hits){ if (n >= a.pierce) break; applyHit(e, a, t); last = e; n++; }
      let ex = x0 + dx * len, ey = y0 + dy * len;
      if (n >= a.pierce && last){ ex = last.x; ey = last.y; }
      if (a.chain) chainFrom(tg, a, t, hits.slice(0, n).map(h => h[1]));
      if (G.vis) G.fx.push({ k:'beam', x1:x0, y1:y0, x2:ex, y2:ey, t:0, life: a.laser ? 0.09 : a.water ? 0.22 : 0.14, w: a.width || 6, c: a.water ? '#7fd3ff' : a.fusion ? '#9ff3ff' : a.type === 'normal' ? '#d6b8ff' : '#ff6b5e', laser: !!a.laser, water: !!a.water });
      t.fireAnim = 0.15;
      Hooks.sfx(a.water ? 'splash' : a.laser ? 'laser' : 'zap');
      return true;
    }
    case 'flame': {
      const tg = acquire(t, range, a);
      if (!tg) return false;
      const ang = Math.atan2(tg.y - t.y, tg.x - t.x);
      setAim(t, id, ang);
      const list = query(t.x, t.y, range, Q1);
      const hits = [];
      for (const e of list){
        if (e.dead) continue;
        const dx = e.x - t.x, dy = e.y - t.y, dist = Math.hypot(dx, dy) || 1;
        let da = Math.atan2(dy, dx) - ang;
        da = Math.atan2(Math.sin(da), Math.cos(da));
        if (Math.abs(da) <= a.cone * 0.5 + Math.atan(e.r / dist)) hits.push([dist, e]);
      }
      hits.sort((p, q) => p[0] - q[0]);
      let n = 0;
      for (const [, e] of hits){ if (n >= a.pierce) break; applyHit(e, a, t); n++; }
      if (G.vis && !lowFx()){
        const k = a.dragon ? 4 : 2;
        for (let i = 0; i < k; i++){
          const aa = ang + rand(-a.cone * 0.45, a.cone * 0.45), v = range * rand(1.6, 2.4);
          part(t.x + Math.cos(ang) * 14, t.y + Math.sin(ang) * 14, Math.cos(aa) * v, Math.sin(aa) * v, 0.38, a.dragon ? '#a35cff' : '#ff8a3d', a.dragon ? 9 : 7, 'flame');
        }
      }
      Hooks.sfx('flame');
      return true;
    }
    case 'hitscan': {
      const mode = a.mode || t.tg;
      let tg = acquire(t, range, a, mode);
      if (!tg) return false;
      const ang = Math.atan2(tg.y - t.y, tg.x - t.x);
      setAim(t, id, ang);
      const shots = a.shots || 1;
      const many = a.multi ? acquireN(t, range, a, mode, shots) : null;
      for (let s = 0; s < shots; s++){
        if (many){ tg = many[s]; if (!tg) break; }
        else if (!tg || tg.dead){ tg = acquire(t, range, a, mode); if (!tg) break; }
        const hx = tg.x, hy = tg.y;
        applyHit(tg, a, t);
        if (a.splash) explodeAt(hx, hy, a.splash, t, null);
        if (a.frag) spawnFrags(hx, hy, a.frag, t);
        if (G.vis){
          if (a.melee) G.fx.push({ k:'whack', x: hx, y: hy, x0: t.x, y0: t.y, t: s * 0.025, life: 0.2 });
          else {
            G.fx.push({ k:'tracer', x1: t.x + Math.cos(ang) * 14, y1: t.y + Math.sin(ang) * 14, x2: hx, y2: hy, t: s * 0.04, life: 0.16, c: '#fff6e0' });
            G.fx.push({ k:'pop', x: hx, y: hy, t: s * 0.04, life: 0.22 });
          }
        }
      }
      t.fireAnim = 0.2;
      if (id !== 'main') t.fire2 = 0.2;
      Hooks.sfx(a.melee ? 'whack' : 'cork');
      return true;
    }
    case 'whirl': {
      const list = acquireN(t, range, a, t.tg, a.count);
      if (!list.length) return false;
      for (let i = 0; i < a.count; i++){
        const e = list[i % list.length];
        const off = i >= list.length ? (i - list.length + 1) * a.r * 1.4 : 0;
        const P = G.paths[e.path];
        const d = Math.min(P.len - 2, e.d + a.r * 0.6 + off);
        const q = pathPos(P, d, e.seg);
        G.whirls.push({ path: e.path, d, seg: q.seg, x: q.x, y: q.y, r: a.r, speed: a.speed, left: a.dist, spec: a, tw: t, hit: new Set(), pierce: a.pierce, t: 0, seed: Math.random() * 10 });
        if (G.vis) G.fx.push({ k:'gust', x1: t.x, y1: t.y, x2: q.x, y2: q.y, t: 0, life: 0.25 });
      }
      setAim(t, id, Math.atan2(list[0].y - t.y, list[0].x - t.x));
      t.fireAnim = 0.3;
      Hooks.sfx('whirl');
      return true;
    }
    case 'grab': {
      const mode = a.mode || (a.hook ? 'strong' : t.tg);
      const list = acquireN(t, range, a, mode, a.count, e => e.holdT <= 0 && (!e.big || a.bigs) && !(e.boss && e.grabImm > 0));
      if (!list.length) return false;
      let any = false;
      for (const e of list) if (grab(e, a, t)) any = true;
      if (!any) return false;
      setAim(t, id, Math.atan2(list[0].y - t.y, list[0].x - t.x));
      t.fireAnim = 0.25;
      if (id !== 'main') t.fire2 = 0.35;
      Hooks.sfx(a.bubble ? 'bubble' : 'hook');
      return true;
    }
    case 'trap': {
      if (!G.roundActive && !G.attract) return false;
      const S = trapSpots(t, range);
      if (!S.pts.length) return false;
      for (let i = 0; i < a.count; i++){
        t.trapN++;
        addTrap(t, a, pickSpot(t, S), !!(a.mineEvery && t.trapN % a.mineEvery === 0));
      }
      t.fireAnim = 0.25;
      Hooks.sfx('squish');
      return true;
    }
  }
  return false;
}
function fireRadial(t, r){
  const n = r.count;
  t.radialRot = (t.radialRot + 0.37) % TAU;
  const life = r.range / r.speed;
  for (let i = 0; i < n; i++){
    const a = t.radialRot + i / n * TAU;
    pushProj(t.x + Math.cos(a) * 10, t.y + Math.sin(a) * 10, a, r.speed, life, r, t);
  }
}
function chainFrom(start, a, tw, already){
  const hit = new Set(already.map(e => e.id));
  hit.add(start.id);
  let cur = start, n = 0;
  const pts = [[start.x, start.y]];
  while (n < a.chain.count){
    const list = query(cur.x, cur.y, a.chain.range, Q3);
    let best = null, bd = Infinity;
    for (const e of list){
      if (e.dead || hit.has(e.id)) continue;
      const d = (e.x - cur.x) ** 2 + (e.y - cur.y) ** 2;
      if (d < bd){ bd = d; best = e; }
    }
    if (!best) break;
    hit.add(best.id);
    pts.push([best.x, best.y]);
    applyHit(best, a, tw);
    cur = best; n++;
  }
  if (G.vis && pts.length > 1) G.fx.push({ k:'zap', pts, t:0, life:0.14 });
}

/* ---------------------------------------------------------------------
   Abilities
   --------------------------------------------------------------------- */
function abilityList(){
  const map = {};
  for (const t of G.towers) for (const ab of t.s.abilities){
    const cur = map[ab.id];
    const cd = t.ab[ab.id] || 0;
    if (!cur) map[ab.id] = { id: ab.id, towers: [t], cd, max: ab.cd };
    else { cur.towers.push(t); if (cd < cur.cd){ cur.cd = cd; cur.max = ab.cd; } }
  }
  /* bar order: shop order at first, then new abilities join at the end so hotkeys never shuffle */
  const ids = Object.keys(ABILITIES);
  const list = Object.values(map).sort((a, b) => ids.indexOf(a.id) - ids.indexOf(b.id));
  G.abOrder = (G.abOrder || []).filter(id => map[id]);
  for (const a of list) if (G.abOrder.indexOf(a.id) < 0) G.abOrder.push(a.id);
  return list.sort((a, b) => G.abOrder.indexOf(a.id) - G.abOrder.indexOf(b.id));
}
function useAbility(id){
  if (!G.active || G.over) return false;
  let best = null;
  for (const t of G.towers){
    const ab = t.s.abilities.find(x => x.id === id);
    if (!ab || (t.ab[id] || 0) > 0) continue;
    if (!best || t.up.reduce((s, v) => s + v, 0) + (t.paragon ? 99 : 0) > best.t.up.reduce((s, v) => s + v, 0) + (best.t.paragon ? 99 : 0)) best = { t, ab };
  }
  if (!best) return false;
  const { t, ab } = best;
  const ok = runAbility(t, ab);
  if (ok){
    t.ab[id] = ab.cd * (perk('quick') ? 0.9 : 1);
    Hooks.sfx('ability');
    Hooks.abilityUsed(id);
  }
  return ok;
}
function runAbility(t, ab){
  switch (ab.id){
    case 'barrage': case 'sugar': case 'delivery': {
      const type = { barrage:'knife', sugar:'siphon', delivery:'oven' }[ab.id];
      for (const o of G.towers) if (o.type === type && (ab.global || Math.hypot(o.x - t.x, o.y - t.y) <= Math.max(200, t.s.range * 1.5))) o.boost[ab.id] = { mult: ab.mult, t: ab.dur };
      if (G.vis) G.fx.push({ k:'ring', x:t.x, y:t.y, r0:10, r1: ab.global ? 400 : 200, t:0, life:0.6, c:'#ffd166', w:5 });

    }
    case 'rush':
      G.glob.rush = { mult: ab.mult, t: ab.dur };
      if (G.vis) G.fx.push({ k:'flash', c:'rgba(255,209,102,0.18)', t:0, life:0.5 });
      return true;
    case 'bagel': {
      const tg = acquireBig({ x:t.x, y:t.y, s:{ camo:true, allTypes:true } }, 9999, null);

      pushProj(t.x, t.y, Math.atan2(tg.y - t.y, tg.x - t.x), spec.speed, 4, spec, t, tg);

    }
    case 'blitz': {

      if (!targets.length) return false;
      for (let i = 0; i < ab.bombs; i++){

        const ox = rand(-20, 20), oy = rand(-20, 20);
        G.timers.push({ t: 0.35 + i * 0.035, fn: () => {
          const x = (e.dead ? e.x : e.x) + ox, y = (e.dead ? e.y : e.y) + oy;

        }});

    case 'tornado': {

        if (e.big) damage(e, ab.bigDmg, 'normal', t, { ignoreImmune:true });
        else { damage(e, ab.dmg, 'normal', t, { ignoreImmune:true }); if (!e.dead) stunE(e, ab.stun); }
      }
      if (G.vis){ G.fx.push({ k:'vat', x:t.x, y:t.y, r:R, t:0, life:0.8 }); G.shake = 0.3; }

    }
    case 'freeze': {

      }
      if (G.vis) G.fx.push({ k:'flash', c:'rgba(191,233,255,0.45)', t:0, life:0.9 });
      Hooks.sfx('freeze');
      return true;
    }
    case 'rinse': {
      for (const e of G.enemies){
        if (e.dead || !onScreen(e)) continue;
        e.mold = false;
        if (!e.boss){ stripArmor(e); knockE(e, e.big ? ab.bigPush : ab.push); }
        if (!e.big) stunE(e, 0.6);
      }
      if (G.vis){ G.fx.push({ k:'rinse', t:0, life:1.1 }); G.shake = 0.25; }
      Hooks.sfx('splash');
      return true;
    }
    case 'pastarain': {
      const src = (t.s.atk.mines && t.s.atk.mines.mine) ? t.s.atk.mines : t.s.atk.main;
      const spec = Object.assign({}, src, { mine: (src && src.mine) || { r:46, dmg:40, pierce:22, type:'blast' } });
      const pts = trailPoints();
      if (!pts.length) return false;
      for (let i = 0; i < ab.count; i++){
        const pt = pts[Math.floor(Math.random() * pts.length)];
        G.timers.push({ t: 0.04 * i, fn: () => addTrap(t, spec, pt, true, { rain:true, life:30, fly:0.45, x0: pt.x, y0: pt.y - 240 }) });
      }
      Hooks.sfx('squish');
      return true;
    }
    case 'supply': {
      const x = clamp(t.x + rand(-60, 60), 30, W - 30), y = clamp(t.y + rand(-50, 50), 30, H - 30);
      addCash(ab.cash);
      t.cashGen += ab.cash;
      G.xp[t.type] = (G.xp[t.type] || 0) + ab.cash * 0.5 * G.xpMult;
      if (G.vis){ G.fx.push({ k:'crate', x, y, t:0, life:1.3, v: ab.cash }); }
      Hooks.sfx('cash');
      return true;
    }
  }
  return false;
}

   Bread

function breadValue(t){
  const b = t.s.bread;
  let mult = 1;
  for (const o of G.towers) if (o.type === 'bread' && o.s.bread && o.s.bread.valueBuff) mult = Math.max(mult, 1 + o.s.bread.valueBuff);
  return Math.round(b.value * mult);
}
function bakeLoaf(t){
  const b = t.s.bread;
  const v = breadValue(t);
  if (b.bank){
    t.bank = Math.min(b.bank.cap, (t.bank || 0) + v);
    t.cashGen += v;
    G.xp.bread = (G.xp.bread || 0) + v * G.xpMult;
    if (G.vis) fxText(t.x, t.y - 22, '+$' + v, '#ffd166', 0.8, 12);
    return;
  }
  const a = rand(0, TAU), dist = rand(22, 46);
  const loaf = { x: clamp(t.x + Math.cos(a) * dist, 14, W - 14), y: clamp(t.y + Math.sin(a) * dist, 14, H - 14), sx: t.x, sy: t.y, t: 0, life: 15, v, tw: t, golden: !!b.golden };
  if (b.auto){ collectLoaf(loaf, true); return; }
  G.loaves.push(loaf);
}
function collectLoaf(L, auto){
  L.done = true;
  addCash(L.v);
  L.tw.cashGen += L.v;
  G.xp.bread = (G.xp.bread || 0) + L.v * G.xpMult;
  if (G.vis){ G.fx.push({ k:'loafFly', x: L.x, y: L.y, t:0, life:0.45, golden: L.golden }); fxText(L.x, L.y - 12, '+$' + L.v, '#ffd166', 0.7, 13); }
  Hooks.sfx('cash');
}
function collectLoavesAt(x, y, r){
  let n = 0;
  for (const L of G.loaves) if (!L.done && L.t > 0.35 && Math.hypot(L.x - x, L.y - y) < r){ collectLoaf(L); n++; }
  if (n) G.loaves = G.loaves.filter(L => !L.done);
  return n;
}
function breadTick(dt){
  for (const t of G.towers){
    if (!t.s.bread || t.loafQ <= 0) continue;
    t.loafT -= dt;
    if (t.loafT <= 0){ t.loafQ--; t.loafT = t.loafGap; bakeLoaf(t); }
  }
}

/* ---------------------------------------------------------------------
   Rounds
   --------------------------------------------------------------------- */
function promote(type, i){
  const p = PROMOTE[type];
  if (!p) return type;
  if (p === '*t3') return T3_POOL[i % T3_POOL.length];
  return p;
}
function startRound(){
  if (!G.active || G.roundActive || G.over || G.won && !G.freeplay) return false;
  G.lastSnap = serializeGame();
  storeGame(G.lastSnap);
  const groups = roundGroups(G.round);
  if (G.mm) groups.forEach((g, i) => { g.type = promote(g.type, i); });
  G.spawn = groups.map(g => Object.assign(g, { spawned: 0 }));
  G.roundActive = true;
  G.roundTime = 0;
  for (const t of G.towers) if (t.s.bread){ t.loafQ = t.s.bread.loaves; t.loafGap = clamp(14 / Math.max(1, t.loafQ), 0.5, 3); t.loafT = 0.8; }
  Hooks.sfx('start');
  Hooks.roundStart(G.round);
  return true;
}
function updateSpawner(dt){
  G.roundTime += dt;
  for (const g of G.spawn){
    while (g.spawned < g.count && G.roundTime >= g.start + g.spawned * g.spacing){
      const m = g.mods;
      const big = ENEMIES[g.type].big;
      spawnEnemy(g.type, { camo: !big && m.includes('c'), mold: !big && m.includes('m'), armored: m.includes('a'), boss: m.includes('B'), hpMul: g.hpMul });
      g.spawned++;
    }
  }
}
function spawnDone(){ return G.spawn && G.spawn.every(g => g.spawned >= g.count); }
function endRound(){
  G.roundActive = false;
  const n = G.round;
  for (const t of G.towers) if (t.s.bread) while (t.loafQ > 0){ t.loafQ--; bakeLoaf(t); }
  for (const L of G.loaves) if (!L.done) collectLoaf(L, true);
  G.loaves = [];
  let bonus = 100 + n + (perk('tips') ? 25 : 0);
  let support = 0;
  const breadCount = G.towers.filter(t => t.type === 'bread').length;
  for (const t of G.towers){
    let inc = t.s.income || 0;
    if (t.s.bread && t.s.bread.network) inc += t.s.bread.network * breadCount;
    if (t.s.bread && t.s.bread.bank){
      const bk = t.s.bread.bank;
      const before = t.bank || 0;
      t.bank = Math.min(bk.cap, before * (1 + bk.rate) + (bk.bonus || 0));
      t.cashGen += t.bank - before;
      G.xp.bread = (G.xp.bread || 0) + (t.bank - before) * G.xpMult;
    }
    if (inc){ support += inc; t.cashGen += inc; G.xp[t.type] = (G.xp[t.type] || 0) + inc * G.xpMult; }
    if (t.type === 'espresso') G.xp.espresso = (G.xp.espresso || 0) + (20 + n * 3) * G.xpMult;
  }
  addCash(bonus + support);
  for (const t of G.towers) for (const k in t.boost) delete t.boost[k];
  G.glob.rush = null;
  Profile.stats.rounds++;
  Profile.stats.best[G.mapId] = Math.max(Profile.stats.best[G.mapId] || 0, n);
  commitXP();
  G.round++;
  G.lastSnap = serializeGame();
  storeGame(G.lastSnap);
  Hooks.roundEnd(n, bonus, support);
  if (n === G.D.win && !G.freeplay && !G.won) victory();
}
function commitXP(){
  if (G.attract){ G.xp = {}; return; }
  let changed = false;
  for (const type in G.xp){
    const gain = G.xp[type];
    if (!(gain > 0)) continue;
    G.xpGame[type] = (G.xpGame[type] || 0) + gain;
    const before = rankOf(Profile.mastery[type] || 0);
    Profile.mastery[type] = Math.round((Profile.mastery[type] || 0) + gain);
    const after = rankOf(Profile.mastery[type]);
    if (after > before){ changed = true; Hooks.rankUp(type, after); }
  }
  Profile.stats.cooked += G.stats.kills - (G.stats.committedKills || 0);
  G.stats.committedKills = G.stats.kills;
  G.xp = {};
  if (changed && G.active) refreshTowers();
  saveProfile();
}
function victory(){
  G.won = true;
  const m = Profile.medals[G.mapId] = Profile.medals[G.mapId] || {};
  const fresh = !m[G.diff];
  m[G.diff] = 1;
  let freshMM = false;
  if (G.mm){ freshMM = !m.mastery; m.mastery = 1; }
  Profile.stats.wins++;
  saveProfile();
  storeGame(serializeGame());
  Hooks.sfx('victory');
  Hooks.victory(fresh, freshMM);
}
function continueFreeplay(){ G.freeplay = true; storeGame(serializeGame()); }
function gameOver(){
  if (G.over) return;
  G.over = true;
  commitXP();
  Hooks.sfx('lose');
  Hooks.gameOver();
}
function retryRound(){
  const snap = G.lastSnap;
  if (!snap) return false;
  const sp = G.speed;
  loadGame(snap);
  G.speed = sp;
  storeGame(snap);
  return true;
}

/* ---------------------------------------------------------------------
   Simulation step
   --------------------------------------------------------------------- */
function towerSpeed(t){
  let m = 1;
  if (G.glob.rush) m *= G.glob.rush.mult;
  for (const k in t.boost) m *= t.boost[k].mult;
  return m;
}
function updateTowers(dt){
  for (const t of G.towers){
    const s = t.s;
    if (t.fireAnim > 0) t.fireAnim -= dt;
    if (t.fire2 > 0) t.fire2 -= dt;
    for (const k in t.boost){ t.boost[k].t -= dt; if (t.boost[k].t <= 0) delete t.boost[k]; }
    if (G.roundActive) for (const id in t.ab) if (t.ab[id] > 0) t.ab[id] = Math.max(0, t.ab[id] - dt);
    if (t.stunT > 0){ t.stunT -= dt; continue; }
    const sp = towerSpeed(t);
    for (const id in s.atk){
      const a = s.atk[id];
      let cd = (t.cd[id] || 0) - dt * sp;
      if (cd <= 0){
        let guard = 0;
        while (cd <= 0 && guard++ < 4){
          if (fire(t, a, id)) cd += a.rate; else { cd = 0; break; }
        }
      }
      t.cd[id] = cd;
    }
    if (s.aura) auraTick(t, s.aura, dt);
  }
}
function auraTick(t, au, dt){
  t.auraAcc += dt;
  if (au.dmg) t.auraDmgAcc += dt;
  if (t.auraAcc < 0.1) return;
  t.auraAcc = 0;
  const list = query(t.x, t.y, t.s.range, Q4);
  const doDmg = au.dmg && t.auraDmgAcc >= au.tick;
  if (doDmg) t.auraDmgAcc -= au.tick;
  let n = 0;
  for (const e of list){
    if (e.dead) continue;
    const cold = au.type === 'cold';
    const immune = cold && e.immune && e.immune.indexOf('cold') >= 0 && !t.s.allTypes;
    if (!immune){
      if (!e.big) slowE(e, au.slow, 0.25);
      else if (au.bigSlow < 1) slowE(e, au.bigSlow, 0.25);
    }
    if (doDmg && n < 80){ damage(e, au.dmg, au.type || 'cold', t, au); n++; }
  }
}
function updateLobs(dt){

function updateProjs(dt){

    if (sp.homing){
      if (!p.target || p.target.dead){
        let best = null, bs = -Infinity;
        for (const e of G.enemies){
          if (e.dead || !onScreen(e)) continue;
          const d = (e.x - p.x) ** 2 + (e.y - p.y) ** 2;
          if (!sp.targetBig && d > 360 * 360) continue;
          const sc = sp.targetBig ? (e.big ? 1e12 : 0) + e.hp - d * 1e-6 : -d;
          if (sc > bs){ bs = sc; best = e; }
        }
        p.target = best;
      }
      if (p.target){
        const want = Math.atan2(p.target.y - p.y, p.target.x - p.x);

    p.x += p.vx * dt; p.y += p.vy * dt;
    const list = query(p.x, p.y, p.size + 3, Q1);

function updateWhirls(dt){

  }

function updateTraps(dt){

    const list = query(tr.x, tr.y, tr.r, Q3);

    }

function updateEnemies(dt){
  const gs = G.globalSlow || 1;
  for (const e of G.enemies){
    if (e.dead) continue;
    e.anim += dt;
    if (e.flashT > 0) e.flashT -= dt;
    if (e.burn){
      const b = e.burn;
      b.t -= dt; b.acc += dt;
      while (b.acc >= b.tick && !e.dead){ b.acc -= b.tick; damage(e, b.dmg, 'heat', b.tw, b.o); }
      if (e.dead) continue;
      if (b.t <= 0) e.burn = null;
    }
    if (e.freezeT > 0){ e.freezeT -= dt; if (e.freezeT <= 0){ e.brittle = 0; e.shatter = null; } }
    if (e.stunT > 0) e.stunT -= dt;
    if (e.slowT > 0){ e.slowT -= dt; if (e.slowT <= 0) e.slowMult = 1; }
    if (e.vulnT > 0) e.vulnT -= dt;
    if (e.soakT > 0) e.soakT -= dt;
    if (e.smokeT > 0){ e.smokeT -= dt; if (e.smokeT <= 0) e.heatMult = 1; }
    if (e.crippleT > 0) e.crippleT -= dt;
    if (e.batterT > 0){ e.batterT -= dt; if (e.batterT <= 0) e.batterMult = 1; }
    if (e.grabImm > 0) e.grabImm -= dt;
    if (e.holdT > 0){ e.holdT -= dt; if (e.holdT <= 0){ releaseHold(e); if (e.dead) continue; } }
    if (e.mold && !e.burn && G.time - e.hitT > 1.5 && e.hp < e.maxHp) e.hp = Math.min(e.maxHp, e.hp + e.maxHp * (e.big ? 0.005 : 0.09) * dt);
    if (e.boss || e.def.dash) bossTick(e, dt);
    let mult = 1;
    if (e.burrowT > 0) mult = 2.2 * gs;
    else if (e.freezeT > 0 || e.stunT > 0 || e.holdT > 0) mult = 0;
    else {
      if (e.slowT > 0) mult = e.slowMult;
      if (e.batterT > 0) mult = Math.min(mult, e.batterMult);
      mult *= e.boss ? 1 - (1 - gs) * 0.5 : gs;
      if (e.dashT > 0) mult *= 3;
    }
    e.d += e.speed * mult * dt;
    const P = G.paths[e.path];

function step(dt){
  if (!G.active || G.paused || G.over) return;
  G.time += dt;
  if (G.glob.rush){ G.glob.rush.t -= dt; if (G.glob.rush.t <= 0) G.glob.rush = null; }
  if (G.blitzCd > 0) G.blitzCd -= dt;
  if (G.admin.infCash) G.cash = Math.max(G.cash, 9999999);
  if (G.roundActive){ updateSpawner(dt); breadTick(dt); }
  updateEnemies(dt);

  updateLobs(dt);
  updateProjs(dt);
  updateWhirls(dt);

  updateLoaves(dt);
  updateFx(dt);

function drawRange(ctx, x, y, r, ok, gold){
  ctx.save(); ctx.beginPath(); ctx.arc(x, y, r, 0, TAU);
  ctx.fillStyle = ok ? (gold ? 'rgba(255,209,102,0.12)' : 'rgba(255,255,255,0.14)') : 'rgba(226,56,63,0.2)'; ctx.fill();

  ctx.restore();
}
function ghostRange(type){
  const T = TOWERS[type];
  if (T.base.global) return 0;
  return T.base.range * (masteryRank(type) >= 4 ? 1.06 : 1);
}
function pasteRange(c){
  const key = c.type + c.up.join('');
  if (pasteRange.key !== key){
    const st = computeStats({ type: c.type, up: c.up.slice(), paragon:false, x:0, y:0 });
    pasteRange.key = key; pasteRange.v = st.global ? 0 : st.range || 0;
  }

}
function renderWorld(ctx, k, ox, oy, bg, t, opt){
  ctx.setTransform(k, 0, 0, k, ox, oy);

  const sel = opt.sel;
  if (sel && !sel.s.global) drawRange(ctx, sel.x, sel.y, sel.s.range, true, !!sel.s.buff);
  for (const L of G.loaves) Art.drawLoaf(ctx, L, t);
  for (const e of G.enemies) if (!e.dead && !e.def.fly && !e.big) Art.drawPest(ctx, e, t);
  for (const e of G.enemies) if (!e.dead && e.big) Art.drawPest(ctx, e, t);
  for (const e of G.enemies) if (!e.dead && e.def.fly) Art.drawPest(ctx, e, t);
  for (const w of G.whirls) Art.drawWhirl(ctx, w, t);
  for (const tw of G.towers){ tw.rank = masteryRank(tw.type); Art.drawTower(ctx, tw, t, { selected: tw === sel || tw === opt.hover }); }
  if (opt.ghost){
    const gh = opt.ghost, type = UI.placing;
    const r = UI.pasting ? pasteRange(UI.pasting) : ghostRange(type);
    if (r) drawRange(ctx, gh.x, gh.y, r, gh.valid && gh.afford, false);
    ctx.save(); ctx.globalAlpha = 0.82;
    Art.drawTower(ctx, { type, x: gh.x, y: gh.y, size: TOWERS[type].size, up: gh.up || [0, 0, 0], aim:-Math.PI / 2, aim2:-Math.PI / 2, fireAnim:0, boost:{}, rank: masteryRank(type) }, t, {});
    ctx.restore();
    if (!gh.valid){ ctx.strokeStyle = 'rgba(226,56,63,0.95)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(gh.x - 9, gh.y - 9); ctx.lineTo(gh.x + 9, gh.y + 9); ctx.moveTo(gh.x + 9, gh.y - 9); ctx.lineTo(gh.x - 9, gh.y + 9); ctx.stroke(); }
    const label = !r ? 'Global range · ' + money(gh.cost) : money(gh.cost);
    ctx.font = '700 14px "Barlow Condensed", sans-serif'; ctx.textAlign = 'center';
    ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(29,43,51,0.85)'; ctx.strokeText(label, gh.x, gh.y + TOWERS[type].size + 18);
    ctx.fillStyle = gh.afford ? '#ffcf4d' : '#ff8a8a'; ctx.fillText(label, gh.x, gh.y + TOWERS[type].size + 18);
  }
  if (sel && sel.s && sel.s.spot){
    if (UI.spotPick === sel && UI.pointer) drawSpot(ctx, UI.pointer.x, UI.pointer.y, t, true);
    else if (sel.spot) drawSpot(ctx, sel.spot.x, sel.spot.y, t, false);
  }
  for (const L of G.lobs) Art.drawLob(ctx, L);
  for (const p of G.projs) Art.drawProj(ctx, p);
  for (const tn of G.tornados) Art.drawTornado(ctx, tn, t);
  if (!lowFx() || G.parts.length < 200) for (const p of G.parts) Art.drawPart(ctx, p);
  for (const f of G.fx) Art.drawFx(ctx, f, t);
  if (UI.debug){
    ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(0,255,120,0.8)';
    for (const P of G.paths){ ctx.beginPath(); P.pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.stroke(); }
    ctx.strokeStyle = 'rgba(255,0,200,0.7)';
    for (const e of G.enemies){ ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, TAU); ctx.stroke(); }
    for (const d of G.map.deco) if (d.solid){ ctx.strokeStyle = 'rgba(255,80,80,0.8)'; ctx.beginPath(); if (d.r) ctx.arc(d.x, d.y, d.r, 0, TAU); else ctx.rect(d.x, d.y, d.w, d.h); ctx.stroke(); }
  }
  if (UI.fps && !opt.menu){
    ctx.setTransform(k, 0, 0, k, ox, oy);
    ctx.font = '700 13px "Barlow Condensed", sans-serif'; ctx.textAlign = 'right'; ctx.fillStyle = '#7ee07a';
    ctx.fillText(UI.fpsVal + ' fps · ' + G.enemies.length + ' pests · ' + G.projs.length + ' shots · ' + G.parts.length + ' fx', W - 10, H - 10);
  }
}
function drawSpot(ctx, x, y, t, live){
  ctx.save(); ctx.translate(x, y);
  const r = 26 + Math.sin(t * 5) * 2;
  ctx.strokeStyle = live ? 'rgba(255,255,255,0.95)' : 'rgba(226,56,63,0.95)'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.stroke();
  ctx.beginPath(); ctx.arc(0, 0, 6, 0, TAU); ctx.stroke();
  ctx.beginPath(); for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]){ ctx.moveTo(dx * (r - 9), dy * (r - 9)); ctx.lineTo(dx * (r + 9), dy * (r + 9)); } ctx.stroke();
  ctx.restore();
}
function renderGame(){
  const cv = $('#cv'), ctx = cv.getContext('2d');

function toLogical(ev){ const r = $('#cv').getBoundingClientRect(); return { x: (ev.clientX - r.left) / r.width * W, y: (ev.clientY - r.top) / r.height * H }; }
function towerAt(x, y){
